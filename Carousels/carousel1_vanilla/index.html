<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sibanda Design</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <section class="hero">

        <h1 class="main-heading">
            Welcome to Sibanda Design
        </h1>

        <p class="sub-heading">
            Modern Web Development • Digital Magic • Responsive Design
        </p>

    </section>

    <div class="carousel-container">

        <button class="nav-btn prev">&#10094;</button>

        <div class="carousel-wrapper">

            <div class="carousel-track">

                <div class="slide red">
                    <h2>Slide 1</h2>
                    <button class="goto-btn">Go To</button>
                </div>

                <div class="slide blue">
                    <h2>Slide 2</h2>
                    <button class="goto-btn">Go To</button>
                </div>

                <div class="slide green">
                    <h2>Slide 3</h2>
                    <button class="goto-btn">Go To</button>
                </div>

                <div class="slide purple">
                    <h2>Slide 4</h2>
                    <button class="goto-btn">Go To</button>
                </div>

                <div class="slide orange">
                    <h2>Slide 5</h2>
                    <button class="goto-btn">Go To</button>
                </div>

                <div class="slide teal">
                    <h2>Slide 6</h2>
                    <button class="goto-btn">Go To</button>
                </div>

            </div>

        </div>

        <button class="nav-btn next">&#10095;</button>

    </div>

    <div class="dots"></div>

    <script src="script.js"></script>

</body>
</html>
