<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sibanda Design | Footer Component</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  
  <main class="content-wrapper">
    <section class="hero">
      <h1>Welcome to Sibanda Design</h1>
      <p>If you want to go fast, go alone. If you want to go far, go together. I am because we are. </br> [scroll down.]</p>
    </section>
  </main>

  <!-- Reusable Footer Component -->
  <footer class="site-footer">
    <div class="footer-container">
      
      <!-- Brand / Logo Section -->
      <div class="footer-brand">
        <a href="#" class="footer-logo">
           Sibanda Design
        </a>
        <p class="brand-tagline">Creating digital magic.</p>
      </div>

      <!-- Navi Links -->
      <div class="footer-links">
        <h3>Explore</h3>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Services</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </div>

      <!-- Social Media Media Links -->
      <div class="footer-socials">
        <h3>Connect With Us</h3>
        <div class="social-icons">
          <a href="#" aria-label="Facebook" class="social-icon"><i class="fa-brands fa-facebook-f"></i></a>
          <a href="#" aria-label="X (formerly Twitter)" class="social-icon"><i class="fa-brands fa-x-twitter"></i></a>
          <a href="#" aria-label="Instagram" class="social-icon"><i class="fa-brands fa-instagram"></i></a>
        </div>
      </div>

    </div>

    <!-- Bottom Bar with Copyright & Dynamic Features -->
    <div class="footer-bottom">
      <div class="bottom-container">
        <p class="copyright">&copy; <span id="current-year"></span> Sibanda Design. All rights reserved.</p>
        <button id="back-to-top" class="back-to-top-btn" aria-label="Back to top">
          Back to Top <i class="fa-solid fa-arrow-up"></i>
        </button>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
