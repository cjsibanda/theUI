<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sibanda's Flowers</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <h1>SIBANDA'S FLOWERS</h1>
        <p class="tagline">Free Same Day Delivery</p>
    </header>

    <main>
        <section class="product-grid">

            <div class="product-card">
                <img src="images/flower1.jpg" alt="Spring Splendor">

                <div class="product-info">
                    <h2>Spring Splendor</h2>
                    <p class="price">$90.00</p>

                    <div class="delivery">
                        🚚 FREE SAME DAY DELIVERY
                    </div>

                    <button class="buy-btn">
                        Buy Now
                    </button>
                </div>
            </div>

            <div class="product-card">
                <img src="images/flower2.jpg" alt="Blushing">

                <div class="product-info">
                    <h2>Blushing</h2>
                    <p class="price">$180.00</p>

                    <div class="delivery">
                        🚚 FREE SAME DAY DELIVERY
                    </div>

                    <button class="buy-btn">
                        Buy Now
                    </button>
                </div>
            </div>

            <div class="product-card">
                <img src="images/flower3.jpg" alt="Whimsical Heart Burst">

                <div class="product-info">
                    <h2>Whimsical Heart Burst</h2>
                    <p class="price">$230.00</p>

                    <div class="delivery">
                        🚚 FREE SAME DAY DELIVERY
                    </div>

                    <button class="buy-btn">
                        Buy Now
                    </button>
                </div>
            </div>

        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
