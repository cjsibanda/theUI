<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sibanda Products Grid</title>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- PRODUCTS GRID COMPONENT -->
  <section class="products-section">

    <h1 class="section-title">
      Sibanda's Available Products:
    </h1>

    <div class="products-grid" id="productsGrid">

      <!-- Product 1 (Sibanda option 1) -->
      <div class="product-card">
        <div class="image-placeholder">
          Boks
        </div>

        <h2 class="product-name">Product 1</h2>

        <p class="product-price">$50.50</p>

        <button class="add-btn">
          Add
        </button>
      </div>

      <!-- Product 2 (Sibanda Option 2) -->
      <div class="product-card">
        <div class="image-placeholder">
          Lions
        </div>

        <h2 class="product-name">Product 2</h2>

        <p class="product-price">$20.20</p>

        <button class="add-btn">
          Add
        </button>
      </div>

      <!-- Product 3 (Sibanda Option3) -->
      <div class="product-card">
        <div class="image-placeholder">
          Cheetahs
        </div>

        <h2 class="product-name">Product 3</h2>

        <p class="product-price">$10.10</p>

        <button class="add-btn">
          Add
        </button>
      </div>

      <!-- Product 4 (Sibanda Option4) -->
      <div class="product-card">
        <div class="image-placeholder">
          Sharks
        </div>

        <h2 class="product-name">Product 4</h2>

        <p class="product-price">$25.25</p>

        <button class="add-btn">
          Add
        </button>
      </div>

      <!-- Product 5 (Sibanda Option5) -->
      <div class="product-card">
        <div class="image-placeholder">
          Province
        </div>

        <h2 class="product-name">Product 5</h2>

        <p class="product-price">$12.34</p>

        <button class="add-btn">
          Add
        </button>
      </div>

      <!-- Product 6 (Sibanda Option6) -->
      <div class="product-card">
        <div class="image-placeholder">
          Stomers
        </div>

        <h2 class="product-name">Product 6</h2>

        <p class="product-price">$19.99</p>

        <button class="add-btn">
          Add
        </button>
      </div>

    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
